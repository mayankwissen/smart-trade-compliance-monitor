<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Surveillance Engine — Wissen Technology</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;overflow:hidden}
    body{font-family:'Inter',sans-serif;font-size:13px}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#f0b429;border-radius:3px}
    ::-webkit-scrollbar-thumb:hover{background:#fbbf24}

    @keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
    @keyframes pulse-badge{0%,100%{opacity:1}50%{opacity:.55}}
    @keyframes slide-in{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
    @keyframes fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @keyframes scale-in{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    @keyframes glow{0%,100%{text-shadow:0 0 20px currentColor}50%{text-shadow:0 0 40px currentColor,0 0 60px currentColor}}
    @keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    .slide-in{animation:slide-in .25s ease both}
    .fade-up{animation:fade-up .3s ease both}
    .scale-in{animation:scale-in .4s cubic-bezier(.34,1.56,.64,1) both}
    .glow-text{animation:glow 2s ease-in-out infinite}
    .pulse{animation:pulse-badge 2s ease-in-out infinite}
    .spin{animation:spin .8s linear infinite;display:inline-block}
    .ticker-wrap{overflow:hidden;flex:1;-webkit-mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
    .ticker-track{display:flex;animation:ticker 40s linear infinite;width:max-content}
    .ticker-track:hover{animation-play-state:paused}

    .dt{width:100%;border-collapse:collapse}
    .dt th{padding:9px 14px;text-align:left;font-size:11px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;white-space:nowrap;border-bottom:1px solid var(--border)}
    .dt td{padding:0 14px;border-bottom:1px solid var(--border-subtle);font-size:14px}
    .dt tbody tr{height:50px;cursor:pointer;transition:background .12s}
    .dt tbody tr:hover{background:var(--row-hover)}
    .dt tbody tr.sel{border-left:3px solid var(--gold);background:var(--row-selected)}
    .dt tbody tr.flagged{background:rgba(239,68,68,.04)}
    .dt-wrap{overflow-y:auto;max-height:500px}

    .tab-btn{padding:8px 18px;border:none;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:12px;font-weight:600;letter-spacing:.04em;transition:all .15s}
    .tab-btn.active{border-bottom-color:var(--gold);color:var(--gold)}

    .page-scroll{flex:1;overflow-y:auto;padding:20px;min-height:0}

    input,select{font-family:'Inter',sans-serif;font-size:12px;outline:none}
    button{font-family:'Inter',sans-serif}

    @media(max-width:1100px){.main-cols{flex-direction:column!important}.col-l,.col-r{width:100%!important}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo, createContext, useContext } = React;

const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:5000'
  : 'https://trade-surveillance-api.onrender.com';

/* ── Theme ──────────────────────────────────────────────────────────────── */
const DARK = {
  bg:'#0a0a0a', sidebar:'#0f0f0f', card:'#141414', border:'#2a2a2a',
  borderSubtle:'#1a1a1a', gold:'#f0b429', goldHover:'#fbbf24',
  success:'#22c55e', warning:'#f59e0b', danger:'#ef4444', info:'#3b82f6',
  text:'#ffffff', textSec:'#a0a0a0', textMuted:'#525252',
  rowHover:'rgba(240,180,41,.04)', rowSelected:'rgba(240,180,41,.07)',
  inputBg:'#1a1a1a', inputBorder:'#2a2a2a',
  tagLayering:'#6366f1', tagSpoofing:'#ef4444', tagWash:'#f97316', tagPump:'#ec4899',
};
const LIGHT = {
  bg:'#f8fafc', sidebar:'#f1f5f9', card:'#ffffff', border:'#e2e8f0',
  borderSubtle:'#f1f5f9', gold:'#1e3a8a', goldHover:'#1d4ed8',
  success:'#16a34a', warning:'#d97706', danger:'#dc2626', info:'#2563eb',
  text:'#0f172a', textSec:'#475569', textMuted:'#94a3b8',
  rowHover:'rgba(30,58,138,.04)', rowSelected:'rgba(30,58,138,.07)',
  inputBg:'#f8fafc', inputBorder:'#e2e8f0',
  tagLayering:'#4f46e5', tagSpoofing:'#dc2626', tagWash:'#ea580c', tagPump:'#db2777',
};

const ThemeCtx = createContext(DARK);
const useT = () => useContext(ThemeCtx);

/* ── CSS variables helper ───────────────────────────────────────────────── */
function ThemeVars({ t }) {
  useEffect(() => {
    const r = document.documentElement;
    r.style.setProperty('--border', t.border);
    r.style.setProperty('--border-subtle', t.borderSubtle);
    r.style.setProperty('--gold', t.gold);
    r.style.setProperty('--row-hover', t.rowHover);
    r.style.setProperty('--row-selected', t.rowSelected);
  }, [t]);
  return null;
}

/* ── Routing ────────────────────────────────────────────────────────────── */
function useRoute() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  useEffect(() => {
    const h = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  const nav = useCallback(p => { window.location.hash = p; }, []);
  const raw = hash.replace(/^#/, '') || '/';
  let page = 'dashboard', alertId = null;
  if (raw === '/' || raw === '') page = 'dashboard';
  else if (raw === '/alerts')    page = 'alerts';
  else if (raw.startsWith('/alert/')) { page = 'alert-detail'; alertId = raw.slice(7); }
  else if (raw === '/trades')    page = 'trades';
  else if (raw === '/logs')      page = 'logs';
  else if (raw === '/settings')  page = 'settings';
  return { page, alertId, nav };
}

/* ── Utils ──────────────────────────────────────────────────────────────── */
const fmtTime  = ts => ts ? (ts.includes('T') ? ts.split('T')[1].slice(0,8) : ts.slice(11,19)) : '--';
const fmtDate  = ts => ts ? ts.replace('T',' ').slice(0,19) : '--';
const fmtNum   = n  => Number(n||0).toLocaleString('en-IN');
const fmtRs    = n  => '₹' + Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtK     = n  => n >= 1e7 ? (n/1e7).toFixed(1)+'Cr' : n >= 1e5 ? (n/1e5).toFixed(1)+'L' : fmtNum(n);

/* ── Badge configs ──────────────────────────────────────────────────────── */
const SEV_CFG = { HIGH:{bg:'#ef4444',c:'#fff'}, MEDIUM:{bg:'#f59e0b',c:'#fff'}, LOW:{bg:'#22c55e',c:'#fff'} };
const PAT_CFG = { LAYERING:{bg:'#6366f1',c:'#fff'}, SPOOFING:{bg:'#ef4444',c:'#fff'}, WASH_TRADING:{bg:'#f97316',c:'#fff'}, PUMP_DUMP:{bg:'#ec4899',c:'#fff'} };
const STA_CFG = { PENDING:{bg:'#374151',c:'#9ca3af'}, ESCALATED:{bg:'#ef4444',c:'#fff',pulse:true}, DISMISSED:{bg:'#22c55e',c:'#fff'} };
const ESC_COL = { CASE_CREATED:'#22c55e', SLACK_NOTIFIED:'#3b82f6', WATCHLIST_FLAGGED:'#f59e0b', EMAIL_SENT:'#a855f7', NO_ESCALATION:'#525252' };

/* ── Shared components ──────────────────────────────────────────────────── */
function Bdg({ label, cfg, lg }) {
  if (!cfg) cfg = {bg:'#2a2a2a',c:'#525252'};
  return <span className={cfg.pulse?'pulse':''} style={{ display:'inline-flex',alignItems:'center',justifyContent:'center',borderRadius:20,fontSize:lg?13:12,fontWeight:700,padding:lg?'5px 14px':'3px 11px',background:cfg.bg,color:cfg.c,whiteSpace:'nowrap',fontFamily:"'Inter',sans-serif",letterSpacing:'.03em' }}>{(label||'').replace('_',' ')}</span>;
}

function Btn({ children, onClick, variant='primary', small, disabled, style:sx }) {
  const t = useT();
  const base = { border:'none',borderRadius:6,cursor:disabled?'default':'pointer',fontFamily:"'Inter',sans-serif",fontWeight:600,transition:'all .15s',display:'inline-flex',alignItems:'center',gap:6,...sx };
  const variants = {
    primary:  { background:t.gold,       color:'#000',   padding:small?'5px 12px':'7px 18px', fontSize:small?11:12, opacity:disabled?.5:1 },
    danger:   { background:t.danger,     color:'#fff',   padding:small?'5px 12px':'7px 18px', fontSize:small?11:12 },
    ghost:    { background:'transparent',color:t.gold,   border:`1px solid ${t.gold}`,         padding:small?'4px 11px':'6px 16px', fontSize:small?11:12, opacity:disabled?.5:1 },
    outline:  { background:'transparent',color:t.textSec,border:`1px solid ${t.border}`,       padding:small?'4px 11px':'6px 16px', fontSize:small?11:12 },
    triage:   { background:'transparent',color:t.info,   border:`1px solid ${t.info}22`,       padding:'4px 10px', fontSize:11, borderRadius:4 },
  };
  return <button style={{...base,...variants[variant]}} onClick={disabled?undefined:onClick} disabled={disabled}>{children}</button>;
}

function Card({ children, style:sx, pad=16 }) {
  const t = useT();
  return <div style={{ background:t.card,border:`1px solid ${t.border}`,borderRadius:12,padding:pad,...sx }}>{children}</div>;
}

function SectionHead({ title, right, count }) {
  const t = useT();
  return (
    <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14 }}>
      <div style={{ display:'flex',alignItems:'center',gap:10 }}>
        <span style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:12,color:t.textMuted,letterSpacing:'.1em',textTransform:'uppercase' }}>{title}</span>
        {count!==undefined && <span style={{ background:t.gold+'22',color:t.gold,borderRadius:12,padding:'1px 9px',fontSize:12,fontWeight:700 }}>{count}</span>}
      </div>
      {right}
    </div>
  );
}

function Input({ value, onChange, placeholder, style:sx }) {
  const t = useT();
  return <input value={value} onChange={onChange} placeholder={placeholder} style={{ background:t.inputBg,border:`1px solid ${t.inputBorder}`,color:t.text,borderRadius:6,padding:'6px 10px',fontFamily:"'JetBrains Mono',monospace",...sx }} />;
}

function Select({ value, onChange, children, style:sx }) {
  const t = useT();
  return <select value={value} onChange={onChange} style={{ background:t.inputBg,border:`1px solid ${t.border}`,color:t.text,borderRadius:6,padding:'6px 10px',cursor:'pointer',...sx }}>{children}</select>;
}

function Spinner() { return <span className="spin" style={{fontSize:14}}>◌</span>; }

function EmptyState({ icon='📭', msg='No data yet' }) {
  const t = useT();
  return (
    <div style={{ display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'48px 0',gap:12,color:t.textMuted }}>
      <div style={{ fontSize:40 }}>{icon}</div>
      <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:600 }}>{msg}</div>
    </div>
  );
}

/* ── Ticker ─────────────────────────────────────────────────────────────── */
function Ticker({ prices }) {
  const t = useT();
  const syms = ['HDFCBANK','RELIANCE','INFY','TCS','ICICIBANK','WIPRO','SBIN'];
  const items = syms.map(s => {
    const d = prices[s]; if(!d) return null;
    const up = d.current >= (d.low + (d.high - d.low) * .5);
    return (
      <span key={s} style={{ display:'inline-flex',alignItems:'center',gap:7,padding:'0 22px',borderRight:`1px solid ${t.border}`,whiteSpace:'nowrap' }}>
        <span style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:10,color:t.textMuted,letterSpacing:'.08em' }}>{s}</span>
        <span style={{ fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:13,color:up?t.success:t.danger }}>{fmtRs(d.current)}</span>
        <span style={{ fontSize:10,color:up?t.success:t.danger }}>{up?'▲':'▼'}</span>
      </span>
    );
  }).filter(Boolean);
  if (!items.length) return <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',color:t.textMuted,fontSize:11}}>Fetching live prices…</div>;
  return <div className="ticker-wrap" style={{flex:1}}><div className="ticker-track">{items}{items}</div></div>;
}

/* ── Sidebar ────────────────────────────────────────────────────────────── */
function Sidebar({ page, nav }) {
  const t = useT();
  const links = [
    { icon:'🏠', label:'Dashboard', to:'/' },
    { icon:'🔔', label:'Alerts',    to:'/alerts' },
    { icon:'📊', label:'Trades',    to:'/trades' },
    { icon:'⚡', label:'Logs',      to:'/logs' },
    { icon:'⚙', label:'Settings',  to:'/settings' },
  ];
  const active = page === 'dashboard' ? '/' : page === 'alert-detail' ? '/alerts' : `/${page}`;
  return (
    <div style={{ width:72,background:t.sidebar,borderRight:`1px solid ${t.border}`,display:'flex',flexDirection:'column',alignItems:'center',paddingTop:8,flexShrink:0,zIndex:50 }}>
      {links.map(l => (
        <div key={l.to} title={l.label} onClick={() => nav(l.to)}
          style={{ width:'100%',height:64,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:4,cursor:'pointer',borderLeft:`3px solid ${active===l.to?t.gold:'transparent'}`,background:active===l.to?t.gold+'18':'transparent',transition:'all .15s' }}
          onMouseEnter={e=>{if(active!==l.to)e.currentTarget.style.background=t.gold+'0a';}}
          onMouseLeave={e=>{if(active!==l.to)e.currentTarget.style.background='transparent';}}>
          <span style={{ fontSize:28,lineHeight:1 }}>{l.icon}</span>
          <span style={{ fontSize:10,fontFamily:"'Inter',sans-serif",fontWeight:700,color:active===l.to?t.gold:t.textMuted,letterSpacing:'.05em',textTransform:'uppercase' }}>{l.label.slice(0,4)}</span>
        </div>
      ))}
    </div>
  );
}

/* ── Header ─────────────────────────────────────────────────────────────── */
function Header({ isReplaying, onStart, onStop, prices, isDark, onToggleTheme, subCount, onSubscribe }) {
  const t = useT();
  const [email, setEmail] = useState('');
  const [subStatus, setSubStatus] = useState('');
  const doSubscribe = async () => {
    if (!email || !email.includes('@')) return;
    try {
      const r = await fetch(`${API_BASE}/api/subscribe`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
      const d = await r.json();
      if (d.status === 'subscribed') { setSubStatus('subscribed'); onSubscribe && onSubscribe(); }
    } catch { setSubStatus('error'); }
  };
  return (
    <div style={{ height:64,background:'#000000',borderBottom:`2px solid ${t.gold}`,display:'flex',alignItems:'center',padding:'0 16px',gap:12,flexShrink:0,zIndex:100 }}>
      <div style={{ display:'flex',alignItems:'center',gap:10,flexShrink:0 }}>
        <div style={{ width:38,height:38,borderRadius:'50%',background:t.gold+'22',border:`1px solid ${t.gold}`,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,boxShadow:`0 0 12px ${t.gold}40` }}>🛡</div>
        <div>
          <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:18,color:'#f0b429',letterSpacing:'.03em' }}>TRADE SURVEILLANCE ENGINE</div>
          <div style={{ fontSize:11,color:t.textMuted,fontFamily:"'Inter',sans-serif" }}>Wissen Technology Hackathon 2026 · Claude AI</div>
        </div>
      </div>

      <Ticker prices={prices} />

      <div style={{ display:'flex',alignItems:'center',gap:8,flexShrink:0 }}>
        {subStatus === 'subscribed'
          ? <span style={{ color:t.success,fontSize:12,fontWeight:600 }}>✓ Subscribed</span>
          : <>
              <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="analyst@bank.com"
                onKeyDown={e=>e.key==='Enter'&&doSubscribe()}
                style={{ background:'#1a1a1a',border:`1px solid ${t.border}`,color:t.text,borderRadius:6,padding:'6px 10px',fontSize:11,fontFamily:"'JetBrains Mono',monospace",width:148,outline:'none' }} />
              <button onClick={doSubscribe} style={{ background:'transparent',color:t.success,border:`1px solid ${t.success}`,borderRadius:6,padding:'6px 12px',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontWeight:600,fontSize:11,transition:'all .15s',flexShrink:0 }}>Subscribe</button>
            </>
        }
        {subCount > 0 && <span style={{ color:t.textMuted,fontSize:11 }}>👥{subCount}</span>}
        <button onClick={onToggleTheme} style={{ background:'transparent',border:`1px solid ${t.border}`,borderRadius:6,padding:'5px 9px',cursor:'pointer',fontSize:14,color:t.textSec }} title="Toggle theme">{isDark?'☀':'🌙'}</button>
        <div style={{ width:1,height:28,background:t.border }} />
        {isReplaying ? (
          <div style={{ display:'flex',alignItems:'center',gap:8 }}>
            <span style={{ width:8,height:8,borderRadius:'50%',background:t.success,display:'inline-block',animation:'pulse-dot 1.4s ease-in-out infinite' }} />
            <span style={{ color:t.success,fontSize:11,fontFamily:"'Inter',sans-serif",fontWeight:700 }}>LIVE</span>
            <button onClick={onStop} style={{ background:'#1a1a1a',color:t.textSec,border:`1px solid ${t.border}`,borderRadius:6,padding:'6px 14px',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontWeight:600,fontSize:12 }}>⏹ STOP</button>
          </div>
        ) : (
          <button onClick={onStart} style={{ background:t.gold,color:'#000',border:'none',borderRadius:6,padding:'7px 16px',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:12 }}>▶ START REPLAY</button>
        )}
      </div>
    </div>
  );
}

/* ── Stats bar ──────────────────────────────────────────────────────────── */
function StatsBar({ stats }) {
  const t = useT();
  const cards = [
    { label:'Total Trades',    v:stats.total_trades||0,  border:t.gold,  vc:t.gold },
    { label:'Alerts Detected', v:stats.total_alerts||0,  border:t.warning,  vc:t.warning },
    { label:'Escalated',       v:stats.escalated||0,     border:t.danger,   vc:t.danger },
    { label:'Dismissed',       v:stats.dismissed||0,     border:t.success,  vc:t.success },
    { label:'Pending',         v:stats.pending||0,       border:t.textMuted,vc:t.textSec },
  ];
  return (
    <div style={{ display:'flex',gap:10,padding:'10px 20px',background:t.bg,borderBottom:`1px solid ${t.border}`,flexShrink:0 }}>
      {cards.map((c,i) => (
        <div key={i} className="fade-up" style={{ flex:1,background:t.card,border:`1px solid ${t.border}`,borderLeft:`3px solid ${c.border}`,borderRadius:10,padding:'12px 16px',animationDelay:`${i*50}ms` }}>
          <div style={{ fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:36,color:c.vc,lineHeight:1 }}>{fmtNum(c.v)}</div>
          <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:12,color:t.textMuted,letterSpacing:'.1em',textTransform:'uppercase',marginTop:6 }}>{c.label}</div>
        </div>
      ))}
    </div>
  );
}

/* ── Mini Charts (Dashboard) ─────────────────────────────────────────────── */
function MiniCharts({ stats }) {
  const t = useT();
  const dRef = useRef(null); const dInst = useRef(null);
  const bRef = useRef(null); const bInst = useRef(null);
  const p = stats.patterns || {};

  useEffect(() => {
    if (!dRef.current) return;
    if (dInst.current) dInst.current.destroy();
    const total = (p.layering||0)+(p.spoofing||0)+(p.wash_trading||0);
    dInst.current = new Chart(dRef.current.getContext('2d'),{
      type:'doughnut',
      data:{ labels:['Layering','Spoofing','Wash Trading'], datasets:[{ data:[p.layering||0,p.spoofing||0,p.wash_trading||0], backgroundColor:['#6366f1','#ef4444','#f97316'], borderColor:t.card, borderWidth:3, hoverOffset:6 }] },
      options:{ responsive:true, maintainAspectRatio:false, cutout:'70%',
        plugins:{ legend:{position:'right',labels:{color:t.textSec,font:{family:"'Inter',sans-serif",size:11},padding:8,boxWidth:10}},
          tooltip:{backgroundColor:t.card,titleColor:t.text,bodyColor:t.textSec,borderColor:t.border,borderWidth:1} } },
      plugins:[{id:'ct',afterDraw(c){const{ctx,chartArea:{top,bottom,left,right}}=c;const cx=(left+right)/2,cy=(top+bottom)/2;ctx.save();ctx.font=`bold 20px 'JetBrains Mono',monospace`;ctx.fillStyle=t.text;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(total,cx,cy-5);ctx.font=`9px 'Inter',sans-serif`;ctx.fillStyle=t.textMuted;ctx.fillText('ALERTS',cx,cy+10);ctx.restore();}}],
    });
    return ()=>{if(dInst.current)dInst.current.destroy();};
  }, [JSON.stringify(p), t.card]);

  useEffect(() => {
    if (!bRef.current) return;
    if (bInst.current) bInst.current.destroy();
    const hi = stats.high_severity||0, tot = stats.total_alerts||0, dis = stats.dismissed||0;
    bInst.current = new Chart(bRef.current.getContext('2d'),{
      type:'bar',
      data:{ labels:['HIGH','MEDIUM','LOW'], datasets:[{ data:[hi,Math.max(0,tot-hi-dis),dis], backgroundColor:['#ef4444','#f59e0b','#22c55e'], borderRadius:5, borderSkipped:false }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{backgroundColor:t.card,titleColor:t.text,bodyColor:t.textSec,borderColor:t.border,borderWidth:1}},
        scales:{x:{ticks:{color:t.textMuted,font:{family:"'Inter',sans-serif",size:10}},grid:{color:t.borderSubtle||'#1a1a1a'}},
                y:{ticks:{color:t.textMuted,font:{family:"'Inter',sans-serif",size:10}},grid:{color:t.borderSubtle||'#1a1a1a'},beginAtZero:true}} } });
    return ()=>{if(bInst.current)bInst.current.destroy();};
  }, [stats.high_severity, stats.total_alerts, stats.dismissed, t.card]);

  return (
    <Card style={{ display:'flex',gap:0,overflow:'hidden',padding:0,marginTop:10 }}>

      </div>

      </div>
    </Card>

}

/* ── Top Suspects ────────────────────────────────────────────────────────── */
function TopSuspects({ alerts, nav }) {
  const t = useT();
  const suspects = useMemo(() => {
    const m = {};
    alerts.forEach(a => {
      if (!m[a.trader_id]) m[a.trader_id] = { id:a.trader_id, score:0, count:0, first:a.alert_id };
      m[a.trader_id].score += a.severity==='HIGH'?3:a.severity==='MEDIUM'?2:1;
      m[a.trader_id].count++;
    });
    return Object.values(m).sort((a,b)=>b.score-a.score).slice(0,5);
  }, [alerts]);
  const maxS = suspects[0]?.score||1;
  const rc = [t.danger,'#f97316',t.warning,t.textSec,t.textMuted];
  return (
    <Card style={{ marginTop:10,padding:'14px 16px' }}>
      <SectionHead title="Top Suspects" />
      {suspects.length===0 ? <EmptyState icon="🕵️" msg="No suspects yet" /> :
        suspects.map((s,i) => (
          <div key={s.id} onClick={()=>s.first&&nav(`/alert/${s.first}`)}
            style={{ display:'flex',alignItems:'center',gap:10,padding:'7px 0',borderBottom:`1px solid ${t.borderSubtle||t.border}`,cursor:'pointer',borderRadius:4,transition:'background .12s' }}
            onMouseEnter={e=>e.currentTarget.style.background=t.rowHover}
            onMouseLeave={e=>e.currentTarget.style.background='transparent'}
          >
            <span style={{ fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:16,color:rc[i],width:24,textAlign:'center',flexShrink:0 }}>#{i+1}</span>
            <div style={{ flex:1,minWidth:0 }}>
              <div style={{ display:'flex',alignItems:'center',gap:8,marginBottom:4 }}>
                <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:t.info }}>{s.id}</span>
                <span style={{ background:t.border,color:t.textSec,borderRadius:10,padding:'1px 6px',fontSize:10,fontFamily:"'Inter',sans-serif",fontWeight:700 }}>{s.count}</span>
              </div>
              <div style={{ background:t.borderSubtle||'#1a1a1a',borderRadius:2,height:3 }}>
                <div style={{ height:'100%',background:rc[i],borderRadius:2,width:`${(s.score/maxS)*100}%`,transition:'width .7s ease' }} />
              </div>
            </div>
            <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,fontWeight:700,color:rc[i],width:26,textAlign:'right',flexShrink:0 }}>{s.score}</span>
          </div>
        ))
      }
    </Card>
  );
}

/* ── Alert rows shared ──────────────────────────────────────────────────── */
function AlertRow({ a, selected, onSelect, onTriage, isLoading, nav }) {
  const t = useT();
  const done = a.status !== 'PENDING';
  return (
    <tr className={`slide-in${selected?'sel':''}`}
      onClick={() => { onSelect && onSelect(a); nav && nav(`/alert/${a.alert_id}`); }}
      style={{ borderLeft: selected ? `3px solid ${t.gold}` : undefined }}
    >
      <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.textMuted }}>{fmtTime(a.detected_at)}</span></td>
      <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.gold,fontWeight:700 }}>{a.alert_id}</span></td>
      <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.textSec }}>{a.trader_id}</span></td>
      <td><span style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:14,color:t.text }}>{a.instrument}</span></td>
      <td><Bdg label={a.pattern_type} cfg={PAT_CFG[a.pattern_type]} /></td>
      <td><Bdg label={a.severity} cfg={SEV_CFG[a.severity]} /></td>
      <td><Bdg label={a.status} cfg={STA_CFG[a.status]} /></td>
      {onTriage && (
        <td onClick={e=>e.stopPropagation()}>
          <button className="tab-btn" disabled={isLoading||done}
            onClick={()=>onTriage(a.alert_id)}
            style={{ fontFamily:"'Inter',sans-serif",fontSize:11,fontWeight:600,padding:'3px 10px',borderRadius:4,border:`1px solid ${done?t.border:t.info+'44'}`,background:'transparent',color:done?t.textMuted:t.info,cursor:isLoading||done?'default':'pointer',whiteSpace:'nowrap' }}>
            {isLoading?<Spinner/>:done?'✓ Done':'TRIAGE →'}
          </button>
        </td>
      )}
    </tr>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   PAGE 1 — DASHBOARD
═══════════════════════════════════════════════════════════════════════ */
function Dashboard({ stats, alerts, escalations, isReplaying, onStart, onStop, nav }) {
  const t = useT();
  const [page, setPage] = useState(1);
  const [loadingSet, setLoadingSet] = useState(new Set());
  const [localAlerts, setLocalAlerts] = useState(alerts);
  const [refreshing, setRefreshing] = useState(false);
  useEffect(()=>setLocalAlerts(alerts),[alerts]);
  const PER = 10;
  const paged = localAlerts.slice((page-1)*PER, page*PER);
  const pages = Math.ceil(localAlerts.length / PER) || 1;

  const doRefresh = async () => {
    setRefreshing(true);
    try {
      const d = await fetch(`${API_BASE}/api/refresh-data`,{method:'POST'}).then(r=>r.json());
      alert(`Refreshed! ${d.trades_inserted} trades generated at live NSE prices.`);
      window.location.reload();
    } catch { alert('Refresh failed. Is the backend running?'); }
    finally { setRefreshing(false); }
  };

  const doTriage = async id => {
    setLoadingSet(p=>new Set([...p,id]));
    try {
      const r = await fetch(`${API_BASE}/api/triage/${id}`,{method:'POST'});
      await r.json();
      const ar = await fetch(`${API_BASE}/api/alerts`).then(r=>r.json());
      setLocalAlerts(ar.alerts||[]);
    } catch {}
    finally { setLoadingSet(p=>{const n=new Set(p);n.delete(id);return n;}); }
  };

  return (
    <div className="page-scroll" style={{ background:t.bg }}>
      <div className="main-cols" style={{ display:'flex',gap:12,minHeight:0 }}>
        {/* Left 60% */}
        <div className="col-l" style={{ width:'60%',display:'flex',flexDirection:'column',gap:0,minHeight:0 }}>
          <Card pad={0} style={{ display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden' }}>
            <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',borderBottom:`1px solid ${t.border}` }}>
              <SectionHead title="Alert Feed" count={localAlerts.length} />
              <div style={{ display:'flex',gap:8 }}>
                <Btn small variant="outline" onClick={doRefresh} disabled={refreshing}>{refreshing?'Refreshing…':'🔄 Live Prices'}</Btn>
                <Btn small variant="ghost" onClick={()=>nav('/alerts')}>View All →</Btn>
              </div>
            </div>
            <div className="dt-wrap">
              <table className="dt">
                <thead><tr>{['Time','Alert ID','Trader','Instrument','Pattern','Severity','Status','Action'].map(h=><th key={h} style={{ color:t.textMuted }}>{h}</th>)}</tr></thead>
                <tbody>
                  {paged.length===0 && <tr><td colSpan={8}><EmptyState icon="🔍" msg="Click ▶ START REPLAY to detect patterns" /></td></tr>}
                  {paged.map(a => <AlertRow key={a.alert_id} a={a} onTriage={doTriage} isLoading={loadingSet.has(a.alert_id)} nav={nav} />)}
                </tbody>
              </table>
            </div>
            {pages > 1 && (
              <div style={{ display:'flex',alignItems:'center',justifyContent:'center',gap:8,padding:'10px',borderTop:`1px solid ${t.border}` }}>
                <Btn small variant="outline" disabled={page===1} onClick={()=>setPage(p=>p-1)}>← Prev</Btn>
                <span style={{ color:t.textSec,fontSize:12 }}>Page {page} / {pages}</span>
                <Btn small variant="outline" disabled={page===pages} onClick={()=>setPage(p=>p+1)}>Next →</Btn>
              </div>
            )}
          </Card>
          <MiniCharts stats={stats} />
        </div>

        {/* Right 40% */}
        <div className="col-r" style={{ width:'40%',display:'flex',flexDirection:'column',minHeight:0 }}>
          <TopSuspects alerts={localAlerts} nav={nav} />

          {/* Mini escalation log */}
          <Card style={{ marginTop:10,padding:0,overflow:'hidden' }}>
            <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',padding:'12px 16px',borderBottom:`1px solid ${t.border}` }}>
              <SectionHead title="Recent Escalations" count={escalations.length} />
              <Btn small variant="ghost" onClick={()=>nav('/logs')}>View All →</Btn>
            </div>
            <div>
              {escalations.slice(0,5).map(e=>(
                <div key={e.escalation_id} onClick={()=>e.alert_id&&nav(`/alert/${e.alert_id}`)}
                  style={{ display:'flex',alignItems:'center',gap:12,padding:'9px 16px',borderBottom:`1px solid ${t.borderSubtle||t.border}`,borderLeft:`3px solid ${ESC_COL[e.action_type]||'transparent'}`,cursor:'pointer',transition:'background .12s' }}
                  onMouseEnter={ev=>ev.currentTarget.style.background=t.rowHover}
                  onMouseLeave={ev=>ev.currentTarget.style.background='transparent'}>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:t.textMuted,flexShrink:0 }}>{fmtTime(e.created_at)}</span>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.gold,fontWeight:700 }}>{e.alert_id}</span>
                  <span style={{ fontFamily:"'Inter',sans-serif",fontSize:12,fontWeight:700,color:ESC_COL[e.action_type]||t.textSec }}>{e.action_type}</span>
                </div>
              ))}
              {escalations.length===0 && <EmptyState icon="📋" msg="No escalations yet" />}
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   PAGE 2 — ALERTS LIST
═══════════════════════════════════════════════════════════════════════ */
function AlertsPage({ nav }) {
  const t = useT();
  const [alerts, setAlerts] = useState([]);
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(1);
  const [pattern, setPattern] = useState('');
  const [severity, setSeverity] = useState('');
  const [status, setStatus] = useState('');
  const [search, setSearch] = useState('');
  const [loadingSet, setLoadingSet] = useState(new Set());
  const [autoRunning, setAutoRunning] = useState(false);
  const PER = 20;

  const fetchAlerts = useCallback(async () => {
    const q = new URLSearchParams({ page, limit:PER });
    if (pattern) q.set('pattern_type', pattern);
    if (severity) q.set('severity', severity);
    if (status)   q.set('status', status);
    if (search)   q.set('search', search);
    try {
      const d = await fetch(`${API_BASE}/api/alerts?${q}`).then(r=>r.json());
      setAlerts(d.alerts||[]); setTotal(d.total||0);
    } catch {}
  }, [page, pattern, severity, status, search]);

  useEffect(() => { fetchAlerts(); }, [fetchAlerts]);

  const doTriage = async id => {
    setLoadingSet(p=>new Set([...p,id]));
    try { await fetch(`${API_BASE}/api/triage/${id}`,{method:'POST'}); await fetchAlerts(); }
    catch {} finally { setLoadingSet(p=>{const n=new Set(p);n.delete(id);return n;}); }
  };

  const doAutoTriage = async () => {
    setAutoRunning(true);
    const pending = alerts.filter(a=>a.status==='PENDING');
    for (const a of pending) { await doTriage(a.alert_id); await new Promise(r=>setTimeout(r,600)); }
    setAutoRunning(false);
  };

  const pages = Math.ceil(total/PER)||1;
  const sel = { background:t.inputBg,border:`1px solid ${t.border}`,color:t.text,borderRadius:6,padding:'6px 10px',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontSize:12 };

  return (
    <div className="page-scroll" style={{ background:t.bg }}>
      <Card>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10 }}>
          <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:22,color:t.text }}>Alert Feed <span style={{ color:t.gold }}>{total}</span></div>
          <Btn onClick={doAutoTriage} disabled={autoRunning||alerts.filter(a=>a.status==='PENDING').length===0}>
            {autoRunning?<><Spinner /> Triaging All…</>:`Auto-Triage All Pending`}
          </Btn>
        </div>
        {/* Filters */}
        <div style={{ display:'flex',gap:8,marginBottom:16,flexWrap:'wrap' }}>
          <select value={pattern} onChange={e=>{setPattern(e.target.value);setPage(1);}} style={sel}>
            <option value="">All Patterns</option>
            {['LAYERING','SPOOFING','WASH_TRADING'].map(p=><option key={p}>{p}</option>)}
          </select>
          <select value={severity} onChange={e=>{setSeverity(e.target.value);setPage(1);}} style={sel}>
            <option value="">All Severity</option>
            {['HIGH','MEDIUM','LOW'].map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={status} onChange={e=>{setStatus(e.target.value);setPage(1);}} style={sel}>
            <option value="">All Status</option>
            {['PENDING','ESCALATED','DISMISSED'].map(s=><option key={s}>{s}</option>)}
          </select>
          <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}} placeholder="Search trader / alert ID…"
            style={{ background:t.inputBg,border:`1px solid ${t.border}`,color:t.text,borderRadius:6,padding:'6px 10px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,flex:1,minWidth:160,outline:'none' }} />
        </div>
        <div style={{ overflowX:'auto' }}>
          <table className="dt">
            <thead><tr>{['Time','Alert ID','Trader','Instrument','Pattern','Severity','Status','Action'].map(h=><th key={h} style={{ color:t.textMuted }}>{h}</th>)}</tr></thead>
            <tbody>
              {alerts.length===0 && <tr><td colSpan={8}><EmptyState icon="🔍" msg="No alerts match your filters" /></td></tr>}
              {alerts.map(a=><AlertRow key={a.alert_id} a={a} onTriage={doTriage} isLoading={loadingSet.has(a.alert_id)} nav={nav} />)}
            </tbody>
          </table>
        </div>
        {pages>1 && (
          <div style={{ display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginTop:14 }}>
            <Btn small variant="outline" disabled={page===1} onClick={()=>setPage(p=>p-1)}>← Prev</Btn>
            <span style={{ color:t.textSec,fontSize:12 }}>Page {page} / {pages} &nbsp;·&nbsp; {total} alerts</span>
            <Btn small variant="outline" disabled={page===pages} onClick={()=>setPage(p=>p+1)}>Next →</Btn>
          </div>
        )}
      </Card>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   PAGE 3 — ALERT DETAIL
═══════════════════════════════════════════════════════════════════════ */
function AlertDetailPage({ alertId, nav }) {
  const t = useT();
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [triaging, setTriaging] = useState(false);
  const [tab, setTab] = useState('triage');
  const [barW, setBarW] = useState(0);

  const load = useCallback(async () => {
    try {
      const d = await fetch(`${API_BASE}/api/alert/${alertId}/full`).then(r=>r.json());
      setData(d);
      if (d.triage) setTimeout(()=>setBarW(d.triage.confidence||0), 100);
    } catch {}
    setLoading(false);
  }, [alertId]);

  useEffect(()=>{ setLoading(true); setBarW(0); load(); },[load]);

  const doTriage = async () => {
    setTriaging(true);
    try {
      await fetch(`${API_BASE}/api/triage/${alertId}`,{method:'POST'});
      await load();
    } catch {}
    setTriaging(false);
  };

  if (loading) return <div style={{ display:'flex',alignItems:'center',justifyContent:'center',height:'100%',background:t.bg }}><Spinner/></div>;
  if (!data || !data.alert) return <div style={{ display:'flex',alignItems:'center',justifyContent:'center',height:'100%',background:t.bg,color:t.textMuted }}>Alert not found</div>;

  const { alert, triage, escalations, trades } = data;
  const verdict = triage?.verdict;
  const vc = verdict==='ESCALATE'?t.danger:verdict==='DISMISS'?t.success:t.gold;
  const caseEsc = escalations?.find(e=>e.action_type==='CASE_CREATED');
  const slackEsc = escalations?.find(e=>e.action_type==='SLACK_NOTIFIED');
  const watchEsc = escalations?.find(e=>e.action_type==='WATCHLIST_FLAGGED');
  const emailEsc = escalations?.find(e=>e.action_type==='EMAIL_SENT');
  let caseId = null;
  try { if(caseEsc) caseId = JSON.parse(caseEsc.payload).case_id; } catch {}

  const inputTok = 280, outputTok = 180;
  const cost = ((inputTok*3 + outputTok*15)/1e6).toFixed(6);

  return (
    <div className="page-scroll" style={{ background:t.bg }}>
      {/* Back */}
      <div style={{ display:'flex',alignItems:'center',gap:10,marginBottom:16 }}>
        <button onClick={()=>nav('/alerts')} style={{ background:'transparent',border:`1px solid ${t.border}`,color:t.textSec,borderRadius:6,padding:'5px 12px',cursor:'pointer',fontFamily:"'Inter',sans-serif",fontSize:12 }}>← Back</button>
        <span style={{ color:t.textMuted,fontSize:14,fontFamily:"'Inter',sans-serif" }}>Alert Detail</span>
        <span style={{ color:t.gold,fontFamily:"'JetBrains Mono',monospace",fontSize:14,fontWeight:700 }}>{alert.alert_id}</span>
      </div>

      {/* Alert overview */}
      <Card style={{ marginBottom:16 }}>
        <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:12,color:t.textMuted,letterSpacing:'.1em',textTransform:'uppercase',marginBottom:14 }}>Alert Overview</div>
        <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12 }}>
          {[
            ['Alert ID',    <span style={{ fontFamily:"'JetBrains Mono',monospace",color:t.gold,fontSize:14,fontWeight:700 }}>{alert.alert_id}</span>],
            ['Pattern',     <Bdg label={alert.pattern_type} cfg={PAT_CFG[alert.pattern_type]} />],
            ['Trader ID',   <span style={{ fontFamily:"'JetBrains Mono',monospace",color:t.gold,fontSize:14,fontWeight:700 }}>{alert.trader_id}</span>],
            ['Instrument',  <span style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,color:t.text,fontSize:16 }}>{alert.instrument}</span>],
            ['Severity',    <Bdg label={alert.severity} cfg={SEV_CFG[alert.severity]} lg />],
            ['Status',      <Bdg label={alert.status} cfg={STA_CFG[alert.status]} />],
            ['Session ID',  <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:t.textSec }}>{alert.session_id||'—'}</span>],
            ['Detected At', <span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:t.textMuted }}>{fmtDate(alert.detected_at)}</span>],
          ].map(([k,v],i)=>(
            <div key={i} style={{ background:t.bg,border:`1px solid ${t.border}`,borderRadius:8,padding:'10px 14px' }}>
              <div style={{ fontSize:10,color:t.textMuted,fontFamily:"'Inter',sans-serif",fontWeight:700,letterSpacing:'.1em',marginBottom:5 }}>{k}</div>
              <div>{v}</div>
            </div>
          ))}
        </div>
      </Card>

      {/* Tabs */}
      <Card pad={0} style={{ overflow:'hidden' }}>
        <div style={{ display:'flex',borderBottom:`1px solid ${t.border}`,background:t.bg }}>
          {[['triage','⚡ AI Triage'],['evidence','📊 Evidence & Trades'],['actions','🔔 Escalation Actions']].map(([k,label])=>(
            <button key={k} className={`tab-btn${tab===k?' active':''}`} onClick={()=>setTab(k)}
              style={{ color: tab===k?t.gold:t.textMuted, borderBottomColor: tab===k?t.gold:'transparent', background:'transparent', padding:'12px 20px' }}>
              {label}
            </button>
          ))}
        </div>
        <div style={{ padding:20 }}>

          {/* ── TAB 1: AI TRIAGE ── */}
          {tab==='triage' && (
            <div>
              {!triage && !triaging && (
                <div style={{ textAlign:'center',padding:'32px 0' }}>
                  <div style={{ fontSize:48,marginBottom:16 }}>🤖</div>
                  <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:18,color:t.text,marginBottom:8 }}>Awaiting AI Triage</div>
                  <div style={{ color:t.textMuted,fontSize:13,marginBottom:24 }}>Claude Sonnet will analyze this alert and return a structured verdict</div>
                  <Btn onClick={doTriage} style={{ fontSize:14,padding:'10px 32px' }}>⚡ Triage This Alert</Btn>

              )}
              {triaging && (
                <div style={{ textAlign:'center',padding:'32px 0' }}>
                  <div style={{ fontSize:36,marginBottom:16 }}><Spinner/></div>
                  <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:16,color:t.gold }}>Claude Sonnet Analyzing…</div>
                  <div style={{ color:t.textMuted,fontSize:13,marginTop:8 }}>Checking {alert.pattern_type.replace('_',' ')} pattern against 15 years of surveillance knowledge</div>
                </div>
              )}
              {triage && !triaging && (
                <div>
                  {/* Verdict */}
                  <div style={{ background:t.bg,border:`1px solid ${vc}44`,borderRadius:12,padding:24,textAlign:'center',marginBottom:20 }}>
                    <div style={{ fontSize:10,color:t.textMuted,fontFamily:"'Inter',sans-serif",fontWeight:700,letterSpacing:'.15em',marginBottom:12 }}>AI VERDICT · CLAUDE SONNET</div>
                    <div className="scale-in glow-text num" style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:52,fontWeight:700,color:vc,letterSpacing:'.06em',marginBottom:16 }}>{verdict}</div>
                    <div style={{ background:t.border,borderRadius:4,height:8,overflow:'hidden',marginBottom:8 }}>
                      <div style={{ height:'100%',background:vc,borderRadius:4,width:`${barW}%`,transition:'width .8s cubic-bezier(.4,0,.2,1)' }} />
                    </div>
                    <div style={{ display:'flex',justifyContent:'space-between',fontSize:12,fontFamily:"'Inter',sans-serif",color:t.textMuted }}>
                      <span>CONFIDENCE: <strong style={{ color:t.text }}>{triage.confidence}%</strong></span>
                      <span>FALSE POSITIVE: <strong style={{ color:t.text }}>{triage.false_positive_probability}%</strong></span>
                    </div>
                    {triage.risk_level && (
                      <div style={{ marginTop:12 }}><Bdg label={`RISK: ${triage.risk_level}`} cfg={{ bg:vc+'22',c:vc }} lg /></div>
                    )}
                  </div>

                  {/* API Usage */}

                  ['Sigma', `${alert.sigma}σ`, t.danger],

                      return (
                        <tr key={i} style={{ background: tr.is_suspicious ? t.danger+'0a' : isCan ? '#ef444408' : isExe ? '#22c55e08' : 'transparent' }}>

/* ═══════════════════════════════════════════════════════════════════════
   PAGE 4 — TRADES EXPLORER
═══════════════════════════════════════════════════════════════════════ */
const FLAGGED = new Set(['T-1042','T-2891','T-3301']);

function TradesPage() {
  const t = useT();
  const [trades, setTrades] = useState([]);
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(1);
  const [traderId, setTraderId] = useState('');
  const [instrument, setInstrument] = useState('');
  const [status, setStatus] = useState('');
  const PER = 50;

  const fetch_ = useCallback(async () => {
    const q = new URLSearchParams({ page, limit:PER });
    if (traderId)   q.set('trader_id', traderId);
    if (instrument) q.set('instrument', instrument);
    if (status)     q.set('status', status);
    try {
      const d = await fetch(`${API_BASE}/api/trades?${q}`).then(r=>r.json());
      setTrades(d.trades||[]); setTotal(d.total||0);
    } catch {}
  }, [page,traderId,instrument,status]);

  useEffect(()=>{ fetch_(); },[fetch_]);

  const executed = trades.filter(t=>t.order_status==='EXECUTED').length;
  const cancelled = trades.filter(t=>t.order_status==='CANCELLED').length;
  const cratio = total>0 ? ((cancelled/Math.max(trades.length,1))*100).toFixed(1) : '0.0';
  const pages = Math.ceil(total/PER)||1;
  const sel = { background:t.inputBg,border:`1px solid ${t.border}`,color:t.text,borderRadius:6,padding:'6px 10px',fontFamily:"'Inter',sans-serif",fontSize:12,cursor:'pointer' };

  return (
    <div className="page-scroll" style={{ background:t.bg }}>
      {/* Summary */}
      <div style={{ display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:16 }}>
        {[['Total',total,t.info],['Executed',executed,t.success],['Cancelled',cancelled,t.danger],['Cancel Ratio',cratio+'%',t.warning],['Flagged Traders',FLAGGED.size,t.danger]].map(([k,v,c])=>(
          <Card key={k} style={{ padding:'12px 16px',borderLeft:`3px solid ${c}` }}>
            <div style={{ fontFamily:"'JetBrains Mono',monospace",fontWeight:700,fontSize:20,color:c }}>{v}</div>
            <div style={{ fontSize:10,color:t.textMuted,fontFamily:"'Inter',sans-serif",fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',marginTop:4 }}>{k}</div>
          </Card>
        ))}
      </div>

      <Card>
        <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:22,color:t.text,marginBottom:14 }}>Trade Explorer <span style={{ color:t.textMuted,fontSize:14,fontWeight:400 }}>{total.toLocaleString()} trades</span></div>
        <div style={{ display:'flex',gap:8,marginBottom:16,flexWrap:'wrap' }}>
          <input value={traderId} onChange={e=>{setTraderId(e.target.value);setPage(1);}} placeholder="Filter by Trader ID…"
            style={{ background:t.inputBg,border:`1px solid ${t.border}`,color:t.text,borderRadius:6,padding:'6px 10px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,outline:'none',width:180 }} />
          <select value={instrument} onChange={e=>{setInstrument(e.target.value);setPage(1);}} style={sel}>
            <option value="">All Instruments</option>
            {['HDFCBANK','RELIANCE','INFY','TCS','ICICIBANK','WIPRO','SBIN'].map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={status} onChange={e=>{setStatus(e.target.value);setPage(1);}} style={sel}>
            <option value="">All Status</option>
            {['EXECUTED','CANCELLED','PLACED'].map(s=><option key={s}>{s}</option>)}
          </select>
          <div style={{ flex:1,display:'flex',alignItems:'center',gap:8,justifyContent:'flex-end' }}>
            <div style={{ padding:'4px 10px',background:t.danger+'22',border:`1px solid ${t.danger}44`,borderRadius:6,fontSize:11,color:t.danger,fontFamily:"'Inter',sans-serif",fontWeight:700 }}>
              🚩 Red rows = flagged traders (T-1042, T-2891, T-3301)
            </div>
          </div>
        </div>
        <div className="dt-wrap" style={{ overflowX:'auto' }}>
          <table className="dt">
            <thead><tr>{['Trade ID','Timestamp','Trader','Instrument','Type','Size','Price','Status','Cancel ms'].map(h=><th key={h} style={{ color:t.textMuted }}>{h}</th>)}</tr></thead>
            <tbody>
              {trades.length===0 && <tr><td colSpan={9}><EmptyState icon="📊" msg="No trades found" /></td></tr>}
              {trades.map((tr,i)=>{
                const flagged = FLAGGED.has(tr.trader_id);
                return (
                  <tr key={i} title={flagged?`⚠ Flagged trader — alerts on record`:''} className={flagged?'flagged':''}>
                    <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:t.textMuted }}>{tr.trade_id}</span></td>
                    <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.textSec }}>{tr.timestamp}</span></td>
                    <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:flagged?t.danger:t.gold,fontWeight:700 }}>{tr.trader_id}{flagged?' 🚩':''}</span></td>
                    <td><span style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:14,color:t.text }}>{tr.instrument}</span></td>
                    <td><span style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:14,color:tr.order_type==='BUY'?t.success:t.danger }}>{tr.order_type}</span></td>
                    <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.text }}>{fmtNum(tr.order_size)}</span></td>
                    <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.gold,fontWeight:700 }}>{fmtRs(tr.price)}</span></td>
                    <td><Bdg label={tr.order_status} cfg={tr.order_status==='EXECUTED'?{bg:'#22c55e22',c:'#22c55e'}:tr.order_status==='CANCELLED'?{bg:'#ef444422',c:'#ef4444'}:{bg:'#2a2a2a',c:'#a0a0a0'}} /></td>
                    <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:tr.cancel_time_ms>0&&tr.cancel_time_ms<600?t.danger:t.textSec }}>{tr.cancel_time_ms||'—'}</span></td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {pages>1 && (
          <div style={{ display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginTop:14 }}>
            <Btn small variant="outline" disabled={page===1} onClick={()=>setPage(p=>p-1)}>← Prev</Btn>
            <span style={{ color:t.textSec,fontSize:12 }}>Page {page} / {pages}</span>
            <Btn small variant="outline" disabled={page===pages} onClick={()=>setPage(p=>p+1)}>Next →</Btn>
          </div>
        )}
      </Card>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   PAGE 5 — ESCALATION LOGS
═══════════════════════════════════════════════════════════════════════ */
function LogsPage({ nav }) {
  const t = useT();
  const [escs, setEscs] = useState([]);
  const [total, setTotal] = useState(0);
  const [page, setPage] = useState(1);
  const [actionFilter, setActionFilter] = useState('');
  const PER = 25;

  const fetch_ = useCallback(async () => {
    try {
      const d = await fetch(`${API_BASE}/api/escalations?page=${page}&limit=${PER}`).then(r=>r.json());
      let rows = d.escalations||[];
      if (actionFilter) rows = rows.filter(e=>e.action_type===actionFilter);
      setEscs(rows); setTotal(d.total||0);
    } catch {}
  },[page,actionFilter]);

  useEffect(()=>{ fetch_(); const id=setInterval(fetch_,5000); return()=>clearInterval(id); },[fetch_]);

  const exportCSV = () => {
    const h = ['escalation_id','alert_id','action_type','payload','created_at'];
    const rows = escs.map(e => h.map(k=>`"${(e[k]||'').toString().replace(/"/g,'""')}"`).join(','));
    const csv = [h.join(','), ...rows].join('\n');
    const a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
    a.download = 'escalation-log.csv'; a.click();
  };

  const parseDetails = e => {
    try {
      const p = JSON.parse(e.payload||'{}');
      if (p.case_id) return `Case: ${p.case_id}`;
      if (p.channel) return p.channel;
      if (p.trader_id) return `${p.trader_id} · ${p.monitoring_hours}h`;
      if (p.recipients) return `${p.recipients} email(s)`;
      return e.payload||'';
    } catch { return e.payload||''; }
  };

  const pages = Math.ceil(total/PER)||1;
  const sel = { background:t.inputBg,border:`1px solid ${t.border}`,color:t.text,borderRadius:6,padding:'6px 10px',fontFamily:"'Inter',sans-serif",fontSize:12,cursor:'pointer' };

  return (
    <div className="page-scroll" style={{ background:t.bg }}>
      <Card>
        <div style={{ display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16,flexWrap:'wrap',gap:10 }}>
          <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:22,color:t.text }}>
            Escalation Log <span style={{ color:t.gold }}>{total}</span>
          </div>
          <div style={{ display:'flex',gap:8 }}>
            <select value={actionFilter} onChange={e=>{setActionFilter(e.target.value);setPage(1);}} style={sel}>
              <option value="">All Actions</option>
              {['CASE_CREATED','SLACK_NOTIFIED','WATCHLIST_FLAGGED','EMAIL_SENT','NO_ESCALATION'].map(a=><option key={a}>{a}</option>)}
            </select>
            <Btn small variant="ghost" onClick={exportCSV}>⬇ Export CSV</Btn>
          </div>
        </div>
        <div style={{ overflowX:'auto' }}>
          <table className="dt">
            <thead><tr>{['Time','Alert ID','Action','Details'].map(h=><th key={h} style={{ color:t.textMuted }}>{h}</th>)}</tr></thead>
            <tbody>
              {escs.length===0 && <tr><td colSpan={4}><EmptyState icon="⚡" msg="No escalations yet — triage alerts to see actions" /></td></tr>}
              {escs.map(e=>(
                <tr key={e.escalation_id} onClick={()=>e.alert_id&&nav(`/alert/${e.alert_id}`)}
                  style={{ borderLeft:`3px solid ${ESC_COL[e.action_type]||'transparent'}`,cursor:'pointer' }}>
                  <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.textMuted }}>{fmtDate(e.created_at)}</span></td>
                  <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.gold,fontWeight:700 }}>{e.alert_id}</span></td>
                  <td><span style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:13,color:ESC_COL[e.action_type]||t.textSec }}>{e.action_type}</span></td>
                  <td><span style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:13,color:t.textSec }}>{parseDetails(e)}</span></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        {pages>1 && (
          <div style={{ display:'flex',alignItems:'center',justifyContent:'center',gap:8,marginTop:14 }}>
            <Btn small variant="outline" disabled={page===1} onClick={()=>setPage(p=>p-1)}>← Prev</Btn>
            <span style={{ color:t.textSec,fontSize:12 }}>Page {page} / {pages}</span>
            <Btn small variant="outline" disabled={page===pages} onClick={()=>setPage(p=>p+1)}>Next →</Btn>
          </div>
        )}
      </Card>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   PAGE 6 — SETTINGS / ARCHITECTURE
═══════════════════════════════════════════════════════════════════════ */
function SettingsPage() {
  const t = useT();
  const [health, setHealth] = useState(null);
  const [tokenStats, setTokenStats] = useState(null);
  const [subCount, setSubCount] = useState(0);

  useEffect(()=>{
    fetch(`${API_BASE}/api/health`).then(r=>r.json()).then(setHealth).catch(()=>setHealth({status:'error'}));
    fetch(`${API_BASE}/api/token-stats`).then(r=>r.json()).then(setTokenStats).catch(()=>{});
    fetch(`${API_BASE}/api/subscribers/count`).then(r=>r.json()).then(d=>setSubCount(d.count||0)).catch(()=>{});
  },[]);

  const techStack = [
    { icon:'🐍', name:'Python 3 + Flask', desc:'REST API backend with SQLite' },
    { icon:'🤖', name:'Claude Sonnet 4', desc:'AI triage & structured verdicts' },
    { icon:'⚛', name:'React 18', desc:'Single-file frontend, no build step' },
    { icon:'📈', name:'yfinance', desc:'Real-time NSE market data' },
    { icon:'💬', name:'Slack Webhooks', desc:'Compliance alert notifications' },
    { icon:'📧', name:'SMTP Email', desc:'Subscriber alert emails' },
    { icon:'☁', name:'Render.com', desc:'Cloud deployment, free tier' },
    { icon:'📊', name:'Chart.js 4', desc:'Pattern & severity charts' },
  ];

  const healthChecks = [
    { label:'Backend API',     ok:health?.status==='ok',  detail: health ? `${health.trades_loaded} trades` : '…' },
    { label:'Market Data',     ok:true,  detail:'yfinance live' },
    { label:'Claude AI',       ok:tokenStats?.total_triage_calls >= 0, detail: tokenStats ? `${tokenStats.total_triage_calls} calls` : '…' },
    { label:'Slack Webhook',   ok:true, detail:'Env var set on server' },
  ];

  return (
    <div className="page-scroll" style={{ background:t.bg }}>
      {/* Architecture diagram */}
      <Card style={{ marginBottom:16 }}>
        <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:16,color:t.text,marginBottom:16 }}>System Architecture</div>
        <div style={{ background:t.bg,border:`1px solid ${t.border}`,borderRadius:8,padding:'20px 24px',fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:t.textSec,lineHeight:2,overflowX:'auto' }}>
          <pre style={{ color:t.textSec,margin:0 }}>{`
  yfinance ──┐
             ├──→ [ Ingestor ] ──→ [ SQLite DB ] ──→ [ Detector ]
  CSV Data ──┘                                            │
                                                          │ Alerts
                                                          ↓
                                              [ Triage / Claude AI ]
                                                          │
                                             ┌────────────┴────────────┐
                                             ↓            ↓            ↓
                                        [ Case Files ] [Slack] [Email]
                                             ↓
                                      [ Watchlist DB ]

  React Frontend ←── Flask REST API (20 endpoints) ←── SQLite
          `.trim()}</pre>
        </div>
      </Card>

      {/* Tech stack */}
      <Card style={{ marginBottom:16 }}>
        <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:16,color:t.text,marginBottom:16 }}>Technology Stack</div>
        <div style={{ display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))',gap:10 }}>
          {techStack.map(s=>(
            <div key={s.name} style={{ background:t.bg,border:`1px solid ${t.border}`,borderRadius:8,padding:'12px 14px',display:'flex',alignItems:'flex-start',gap:12 }}>
              <span style={{ fontSize:24,flexShrink:0 }}>{s.icon}</span>
              <div>
                <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,color:t.text,fontSize:13 }}>{s.name}</div>
                <div style={{ color:t.textMuted,fontSize:11,marginTop:3 }}>{s.desc}</div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      <div style={{ display:'grid',gridTemplateColumns:'1fr 1fr',gap:16 }}>
        {/* API Usage */}
        <Card>
          <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:15,color:t.text,marginBottom:14 }}>API Usage Stats</div>
          {tokenStats ? (
            <div style={{ display:'flex',flexDirection:'column',gap:10 }}>
              {[
                ['Total Triage Calls', tokenStats.total_triage_calls, t.gold],
                ['Input Tokens', fmtNum(tokenStats.total_input_tokens), t.info],
                ['Output Tokens', fmtNum(tokenStats.total_output_tokens), t.info],
                ['Total Tokens', fmtNum(tokenStats.total_tokens), t.text],
                ['Estimated Cost', `$${tokenStats.estimated_cost_usd}`, t.warning],
                ['Avg Response', `${tokenStats.avg_processing_time_ms}ms`, t.success],
                ['Subscribers', subCount, t.info],
              ].map(([k,v,c])=>(
                <div key={k} style={{ display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:`1px solid ${t.borderSubtle||t.border}` }}>
                  <span style={{ color:t.textSec,fontSize:13 }}>{k}</span>
                  <span style={{ fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:c,fontSize:14 }}>{v}</span>
                </div>
              ))}
              <div style={{ padding:'8px 12px',background:t.gold+'11',border:`1px solid ${t.gold}33`,borderRadius:8,marginTop:4 }}>
                <div style={{ fontSize:10,color:t.gold,fontFamily:"'Inter',sans-serif",fontWeight:700,letterSpacing:'.08em',marginBottom:4 }}>MODEL</div>
                <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:12,color:t.text }}>{tokenStats.model}</div>
              </div>
            </div>
          ) : <EmptyState icon="📊" msg="No triage calls yet" />}
        </Card>

        {/* Health checks */}
        <Card>
          <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:800,fontSize:15,color:t.text,marginBottom:14 }}>Live Health Checks</div>
          <div style={{ display:'flex',flexDirection:'column',gap:10 }}>
            {healthChecks.map(h=>(
              <div key={h.label} style={{ display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:t.bg,border:`1px solid ${t.border}`,borderRadius:8 }}>
                <div style={{ width:10,height:10,borderRadius:'50%',background:h.ok?t.success:t.danger,flexShrink:0,boxShadow:h.ok?`0 0 8px ${t.success}66`:undefined,animation:h.ok?'pulse-dot 2s ease-in-out infinite':undefined }} />
                <div style={{ flex:1 }}>
                  <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:600,fontSize:13,color:t.text }}>{h.label}</div>
                  <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:t.textMuted,marginTop:2 }}>{h.detail}</div>
                </div>
                <Bdg label={h.ok?'OK':'ERROR'} cfg={h.ok?{bg:'#22c55e22',c:'#22c55e'}:{bg:'#ef444422',c:'#ef4444'}} />
              </div>
            ))}
          </div>
          <div style={{ marginTop:14,padding:'10px 14px',background:t.bg,border:`1px solid ${t.border}`,borderRadius:8 }}>
            <div style={{ fontFamily:"'Inter',sans-serif",fontWeight:700,fontSize:10,color:t.textMuted,letterSpacing:'.1em',marginBottom:6 }}>API ENDPOINT</div>
            <div style={{ fontFamily:"'JetBrains Mono',monospace",fontSize:11,color:t.info }}>{API_BASE}</div>
          </div>
        </Card>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   APP — ROOT ROUTER
═══════════════════════════════════════════════════════════════════════ */
function App() {
  const [isDark, setIsDark] = useState(()=>localStorage.getItem('theme')!=='light');
  const theme = isDark ? DARK : LIGHT;
  const { page, alertId, nav } = useRoute();

  const [stats,       setStats]       = useState({});
  const [alerts,      setAlerts]      = useState([]);
  const [escalations, setEscalations] = useState([]);
  const [prices,      setPrices]      = useState({});
  const [isReplaying, setIsReplaying] = useState(false);
  const [subCount,    setSubCount]    = useState(0);
  const pollRef  = useRef(null);
  const priceRef = useRef(null);

  const toggleTheme = () => {
    setIsDark(d => { localStorage.setItem('theme', d?'light':'dark'); return !d; });
  };

  const fetchAll = useCallback(async () => {
    try {
      const [a,s,e] = await Promise.all([
        fetch(`${API_BASE}/api/alerts`).then(r=>r.json()),
        fetch(`${API_BASE}/api/stats`).then(r=>r.json()),
        fetch(`${API_BASE}/api/escalations`).then(r=>r.json()),
      ]);
      setAlerts(a.alerts||[]);
      setStats(s);
      setEscalations(e.escalations||[]);
    } catch {}
  },[]);

  const fetchPrices = useCallback(async () => {
    try {
      const d = await fetch(`${API_BASE}/api/market-prices`).then(r=>r.json());
      if (d.prices) setPrices(d.prices);
    } catch {}
  },[]);

  const fetchSubCount = useCallback(async () => {
    try {
      const d = await fetch(`${API_BASE}/api/subscribers/count`).then(r=>r.json());
      setSubCount(d.count||0);
    } catch {}
  },[]);

  useEffect(()=>{
    fetchAll(); fetchPrices(); fetchSubCount();
    pollRef.current  = setInterval(fetchAll, 3000);
    priceRef.current = setInterval(fetchPrices, 60000);
    return ()=>{ clearInterval(pollRef.current); clearInterval(priceRef.current); };
  },[]);

  const handleStart = async () => {
    setIsReplaying(true);
    try { await fetch(`${API_BASE}/api/replay/start`,{method:'POST'}); } catch {}
    fetchAll();
  };

  const bg = theme.bg;

  return (
    <ThemeCtx.Provider value={theme}>
      <ThemeVars t={theme} />
      <div style={{ height:'100vh',display:'flex',flexDirection:'column',background:bg,overflow:'hidden' }}>
        <Header isReplaying={isReplaying} onStart={handleStart} onStop={()=>setIsReplaying(false)} prices={prices} isDark={isDark} onToggleTheme={toggleTheme} subCount={subCount} onSubscribe={fetchSubCount} />

        <div style={{ flex:1,display:'flex',minHeight:0,overflow:'hidden' }}>
          <Sidebar page={page} nav={nav} />

          <div style={{ flex:1,display:'flex',flexDirection:'column',minHeight:0,overflow:'hidden',background:bg }}>
            <StatsBar stats={stats} />
            <div style={{ flex:1,overflow:'hidden',minHeight:0 }}>
              {page==='dashboard'    && <Dashboard stats={stats} alerts={alerts} escalations={escalations} isReplaying={isReplaying} onStart={handleStart} onStop={()=>setIsReplaying(false)} nav={nav} />}
              {page==='alerts'       && <AlertsPage nav={nav} />}
              {page==='alert-detail' && alertId && <AlertDetailPage alertId={alertId} nav={nav} />}
              {page==='trades'       && <TradesPage />}
              {page==='logs'         && <LogsPage nav={nav} />}
              {page==='settings'     && <SettingsPage />}
            </div>
          </div>
        </div>
      </div>
    </ThemeCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
