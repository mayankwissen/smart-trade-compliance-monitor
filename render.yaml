services:
  - type: web
    name: trade-surveillance-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SLACK_WEBHOOK_URL
        sync: false
      - key: EMAIL_SENDER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: static
    name: trade-surveillance-ui
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: "/*.js"
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: "/*.css"
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: "/*.html"
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
